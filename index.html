<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(fn) {
              _origFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = String((event && (event.reason ? (event.reason.message || event.reason) : '')) || '');
          if (reasonStr.indexOf('WebSocket') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        // Filter benign Vite HMR websocket reconnection noise in cloud preview containers
        var origWarn = console.warn;
        console.warn = function() {
          var msg = arguments[0] ? String(arguments[0]) : '';
          if (msg.indexOf('failed to connect to websocket') !== -1 || msg.indexOf('WebSocket') !== -1) {
            return;
          }
          return origWarn.apply(console, arguments);
        };

        var origError = console.error;
        console.error = function() {
          var msg = arguments[0] ? String(arguments[0]) : '';
          if (msg.indexOf('failed to connect to websocket') !== -1 || msg.indexOf('WebSocket closed') !== -1) {
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
    <title>Downloader</title>
    <meta name="description" content="Next-generation universal media downloader with multi-resolution video, studio audio extraction, and web asset fetching in an Apple-inspired iOS dark design." />
    <meta property="og:title" content="Downloader" />
    <meta property="og:description" content="Next-generation universal media downloader with multi-resolution video, studio audio extraction, and web asset fetching in an Apple-inspired iOS dark design." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0A0B0E] text-[#EDEDF0] antialiased selection:bg-neutral-700 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
